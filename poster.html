<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <link rel="stylesheet" href="css/poster.css" />
    <title>한빛전기</title>
  </head>
  <body>
    <div class="wrapper">
      <section class="leaflet">
        <div class="hero">
          <div class="head">
            <div class="head__logo">
              <!-- logo -->
              <svg class="hanlight-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="한빛전기 로고" role="img">
                <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M38 51c0-13.2 9.8-24 22-24s22 10.8 22 24c0 9.2-4.8 15.5-9.8 22.5H47.8C42.8 66.5 38 60.2 38 51z"/>
                  <path d="M49 82h22"/>
                  <path d="M52 91h16"/>
                  <path d="M55 100h10"/>
                  <path d="M48 49v22"/>
                  <path d="M72 49v22"/>
                  <path d="M48 60h24"/>
                </g>
                <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
                  <path d="M60 11v10"/>
                  <path d="M91 23l-7.5 7.5"/>
                  <path d="M103 52H92"/>
                  <path d="M17 52h11"/>
                  <path d="M29 23l7.5 7.5"/>
                </g>
              </svg>
              <!-- //logo -->
            </div>
            <div class="head__text">
              <div class="company">한빛전기</div>
              <div class="subtitle">전기공사 · 누전수리</div>
            </div>
          </div>
        </div>

        <div class="services">
          <div class="services__title">SERVICE</div>

          <div class="services__item">
            <div class="item">
              <i class="fa-solid fa-plug"></i>
              <span>전기공사</span>
            </div>

            <div class="item">
              <i class="fa-solid fa-bolt"></i>
              <span>누전수리</span>
            </div>

            <div class="item">
              <i class="fa-solid fa-lightbulb"></i>
              <span>조명교체</span>
            </div>

            <div class="item">
              <i class="fa-solid fa-screwdriver-wrench"></i>
              <span>출장수리</span>
            </div>
          </div>
        </div>

        <div class="contact">
          <div class="contact__badge">빠른 상담 가능</div>

          <div class="contact__phone">
            <i class="fa-solid fa-phone"></i>
            <span>010-5248-1468</span>
          </div>

          <div class="contact__desc">서울 · 경기 출장 가능</div>
        </div>
      </section>

      <section class="poster">
        <div class="label">동네 전기 해결사</div>

        <div class="poster__icon">
          <!-- logo -->
          <svg class="hanlight-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="한빛전기 로고" role="img">
            <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M38 51c0-13.2 9.8-24 22-24s22 10.8 22 24c0 9.2-4.8 15.5-9.8 22.5H47.8C42.8 66.5 38 60.2 38 51z"/>
              <path d="M49 82h22"/>
              <path d="M52 91h16"/>
              <path d="M55 100h10"/>
              <path d="M48 49v22"/>
              <path d="M72 49v22"/>
              <path d="M48 60h24"/>
            </g>
            <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
              <path d="M60 11v10"/>
              <path d="M91 23l-7.5 7.5"/>
              <path d="M103 52H92"/>
              <path d="M17 52h11"/>
              <path d="M29 23l7.5 7.5"/>
            </g>
          </svg>
          <!-- //logo -->
        </div>

        <div class="poster__text">
          <strong class="poster__title">한빛전기</strong>
          <p class="poster__copy">
            누전 · 차단기 · 콘센트 · 조명<br>
            전기 문제 빠르게 봐드립니다
          </p>
        </div>

        <div class="poster__services">
          <div class="item">
            <i class="fa-solid fa-plug"></i>
            <span>전기공사</span>
          </div>

          <div class="item">
            <i class="fa-solid fa-bolt"></i>
            <span>누전수리</span>
          </div>

          <div class="item">
            <i class="fa-solid fa-lightbulb"></i>
            <span>조명교체</span>
          </div>

          <div class="item">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            <span>출장수리</span>
          </div>
        </div>

        <div class="poster__phone">
          <i class="fa-solid fa-phone"></i>
          <span>010-5248-1468</span>
        </div>

        <div class="poster__area">서울 · 경기 출장 가능</div>
      </section>
    </div>
  </body>
</html>
